<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025 MICE 글로벌 전문가 발대식</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 50px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eaeaea;
    }
    .section {
      width: 60%;
      margin: 0 auto 150px auto;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 40px;
      display: inline-block;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }
      h1 {
        font-size: clamp(14px, 4.2vw, 28px);
        letter-spacing: -0.5px;
        white-space: nowrap;
        margin-bottom: 30px;
      }
      .section {
        width: 100%;
        margin-bottom: 80px;
      }
      .section-title {
        font-size: clamp(13px, 4vw, 20px);
        letter-spacing: -0.5px;
        white-space: nowrap;
        margin-bottom: 20px;
      }
    }

    .image-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .image-grid img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>2025년 MICE 글로벌 전문가 발대식 프로젝트</h1>

    <!-- 1. 파란그룹 -->
    <div class="section">
      <div class="section-title">2025 MICE 글로벌 전문가 발대식 (상반기)</div>
      <div class="image-grid" id="blue-group">
      </div>
    </div>

    <!-- 2. 보라그룹 -->
    <div class="section">
      <div class="section-title title-purple">2025 MICE 글로벌 전문가 심화교육</div>
      <div class="image-grid" id="purple-group">
      </div>
    </div>

    <!-- 3. 초록그룹 -->
    <div class="section">
      <div class="section-title title-green">2025 MICE 글로벌 전문가 발대식 (하반기)</div>
      <div class="image-grid" id="green-group">
      </div>
    </div>
  </div>

  <script>
    // 이미지 동적 렌더링
    function loadImages(containerId, prefix, count) {
      const container = document.getElementById(containerId);
      for (let i = 1; i <= count; i++) {
        const img = document.createElement('img');
        img.src = `images/${prefix}_${i}.jpg`;
        img.alt = `${prefix} 이미지 ${i}`;
        // 이미지 로딩 실패 시 숨김 처리 (파일 개수가 다를 경우 대비)
        img.onerror = function() { this.style.display = 'none'; };
        container.appendChild(img);
      }
    }

    // 파일 개수에 맞춰 렌더링 (파란 14장, 보라 8장, 초록 14장)
    loadImages('blue-group', 'mice_blue', 14);
    loadImages('purple-group', 'mice_purple', 8);
    loadImages('green-group', 'mice_green', 14);
  </script>
</body>
</html>
