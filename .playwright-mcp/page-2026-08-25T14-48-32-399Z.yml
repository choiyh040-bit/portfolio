        - generic [ref=e1180]:
          - heading "배송/교환/반품/AS 관련 유의사항" [level=5] [ref=e1181]
          - paragraph [ref=e1182]: 상품상세설명에 배송/교환/반품/취소 관련 안내가 기재된 경우 다음 안내사항보다 우선 적용됩니다.
        - table [ref=e1183]:
          - rowgroup [ref=e1187]:
            - row [ref=e1188]:
              - rowheader "배송정보" [ref=e1189]
              - cell [ref=e1190]:
                - list [ref=e1191]:
                  - listitem [ref=e1192]: 상품별로 상품 특성 및 배송지에 따라 배송유형 및 소요기간이 달라집니다.
                  - listitem [ref=e1193]: 일부 주문상품 또는 예약상품의 경우 기본 배송일 외에 추가 배송 소요일이 발생될 수 있습니다.
                  - listitem [ref=e1194]: 동일 브랜드의 상품이라도 상품별 출고일시가 달라 각각 배송될 수 있습니다.
                  - listitem [ref=e1195]: 제주 및 도서산간 지역은 출고, 반품, 교환시 추가 배송비(항공, 도선료)가 부과 될 수 있습니다.
                  - listitem [ref=e1196]: 상품의 배송비는 공급업체의 정책에 따라 다르오며 공휴일 및 휴일은 배송이 불가합니다.
            - row [ref=e1197]:
              - rowheader "취소/반품/교환 안내" [ref=e1198]
              - cell [ref=e1199]:
                - list [ref=e1200]:
                  - listitem [ref=e1201]: "회수지 정보 : 서울특별시 강남구 압구정로48길 35 (신사동) 투구빌딩 5층 LA KOSMO(라 코스모)"
                  - listitem [ref=e1202]: "반품 배송비 (편도) : 3,350원 (최초 배송비가 무료배송인 경우 3,350원 부과)"
                  - listitem [ref=e1203]: "교환 배송비 (왕복) : 3,350원"
                  - listitem [ref=e1204]: 상품하자 이외 사이즈, 색상교환 등 단순 변심에 의한 교환/반품 택배비 고객부담으로 왕복택배비가 발생합니다. (전자상거래 등에서의 소비자보호에 관한 법률 제18조(청약 철회등)9항에 의거 소비자의 사정에 의한 청약 철회 시 택배비는 소비자 부담입니다.)
                  - listitem [ref=e1205]: 동일 브랜드의 상품이라도 교환/반품 회수지가 다를 수 있습니다. 상품상세 정보 또는 회수지 정보를 확인하신 후 반드시 지정된 회수지로 보내주세요.
                  - listitem [ref=e1206]: 상품을 지정된 회수지가 아닌곳으로 보내실 경우 택배 분실 또는 재발송에 따른 추가 비용이 발생할 수 있습니다.
                  - listitem [ref=e1207]: 고객센터나 "My Page>주문취소/교환/반품 신청"을 통한 교환/반품 접수 없이 상품을 회수지로 보내실 경우 재발송에 따른 추가 비용이 발생할 수 있으며 경우에 따라서는 교환/반품이 어려울 수 있습니다.
                  - listitem [ref=e1208]: 고객님이 받으신 상품의 내용이 표시 광고 및 계약 내용과 다른 경우 상품을 수령하신 날로부터 3개월 이내 또는 그 사실을 안 날(알 수 있었던 날) 부터 30일 이내 신청이 가능합니다.
                  - listitem [ref=e1209]: 결제완료 직후 즉시 주문취소는 "MY Page> 취소/교환/반품 신청"에서 직접 처리 가능합니다.
                  - listitem [ref=e1210]: 주문완료 후 재고 부족 등으로 인해 주문 취소 처리가 될 수도 있는 점 양해 부탁드립니다.
                  - listitem [ref=e1211]: 주문상태가 상품준비중인 경우 취소신청이 가능하며 판매자의 승인 여부(이미 배송을 했거나 포장을 완료한 경우)에 따라 취소가 불가능할 수 있습니다.
                  - listitem [ref=e1212]: 교환 신청은 최초 1회에 한하며, 교환 배송 완료 후에는 추가 교환 신청은 불가합니다.
                  - listitem [ref=e1213]: 반품/교환은 미사용 제품에 한해 배송완료 후 7일 이내 접수하여 주십시오.
                  - listitem [ref=e1214]: 임의반품은 불가하오니 반드시 고객센터나 "MY Page> 주문취소/교환/반품 신청"을 통해서 신청접수를 하시기 바랍니다.
                  - listitem [ref=e1215]: 상품하자, 오배송의 경우 택배비 무료로 교환/반품이 가능하지만 모니터의 색상차이, 착용감, 사이즈의 개인의 선호도는 상품의 하자 사유가 아닙니다.
                  - listitem [ref=e1216]: 고객 부주의로 상품이 훼손, 변경된 경우 반품 / 교환이 불가능 합니다.
                  - listitem [ref=e1217]: 취소/반품 대금환불이 지연 시 전자상거래법에 의거하여 환불지연 배상처리 절차가 진행됩니다.
            - row [ref=e1218]:
              - rowheader "반품/교환 불가능한 경우" [ref=e1219]
              - cell [ref=e1220]:
                - list [ref=e1221]:
                  - listitem [ref=e1222]: 제품을 사용 또는 훼손한 경우, 사은품 누락, 상품 TAG, 보증서, 상품 부자재가 제거 혹은 분실된 경우
                  - listitem [ref=e1223]: 밀봉포장을 개봉했거나 내부 포장재를 훼손 또는 분실한 경우(단, 제품확인을 위한 개봉 제외)
                  - listitem [ref=e1224]: 시간이 경과되어 재판매가 어려울 정도로 상품가치가 상실된 경우
                  - listitem [ref=e1225]: 고객님의 요청에 따라 주문 제작되어 고객님 외에 사용이 어려운 경우
                  - listitem [ref=e1226]: 배송된 상품이 설치가 완료된 경우(가전, 가구 등)
                  - listitem [ref=e1227]: 신선식품(냉장/냉동 포함) 상품을 단순 변심으로 교환/반품 신청하는 경우
                  - listitem [ref=e1228]: 기타 전자상거래 등에서의 소비자보호에 관한 법률이 정하는 청약철회 제한사유에 해당하는 경우
            - row [ref=e1229]:
